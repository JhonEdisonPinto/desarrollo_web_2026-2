<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de mascota</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2d6cdf;
        --primary-dark: #214fa8;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef5ff, #f8fbff);
        color: var(--text);
      }

      .contenedor {
        max-width: 900px;
        margin: 40px auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 25px rgba(45, 108, 223, 0.08);
      }

      h1 {
        margin-top: 0;
        color: var(--primary-dark);
        text-align: center;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .campo {
        display: grid;
        gap: 8px;
      }

      p {
        margin: 0;
        font-weight: 600;
      }

      input {
        width: 100%;
        max-width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
        background: #f7faff;
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:not([type="submit"]):not([type="reset"]):hover {
        background: #e8f1ff;
        border-color: #8bb0ed;
      }

      input:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.15);
      }

      .botones {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .botones input {
        width: auto;
        min-width: 180px;
        font-weight: 700;
        cursor: pointer;
      }

      .submit {
        background: var(--primary);
        color: white;
        border: none;
      }

      .reset {
        background: #eef3ff;
        color: var(--primary-dark);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h1>Registro de adopción y cuidado de mascotas</h1>

      <form id="formulario_n01" name="formularioN01">
        <div class="campo">
          <p>Nombre completo del dueño:</p>
          <input
            type="text"
            id="nombre_dueno"
            name="nombreDueno"
            placeholder="Escriba su nombre completo"
            size="40"
            maxlength="50"
            required
            autocomplete="name"
          />
        </div>

        <div class="campo">
          <p>Nombre de la mascota:</p>
          <input
            type="text"
            id="nombre_mascota"
            name="nombreMascota"
            placeholder="Ej: Rocky"
            size="30"
            maxlength="30"
            required
            autocomplete="off"
          />
        </div>

        <div class="campo">
          <p>Tipo de mascota:</p>
          <input
            type="text"
            id="tipo_mascota"
            name="tipoMascota"
            placeholder="Perro, gato, conejo, etc."
            size="30"
            maxlength="25"
            required
            list="tipos_mascotas"
          />
          <datalist id="tipos_mascotas">
            <option value="Perro"></option>
            <option value="Gato"></option>
            <option value="Conejo"></option>
            <option value="Hámster"></option>
            <option value="Pez"></option>
            <option value="Loro"></option>
          </datalist>
        </div>

        <div class="campo">
          <p>Raza:</p>
          <input
            type="text"
            id="raza"
            name="razaMascota"
            placeholder="Ej: Labrador"
            size="30"
            maxlength="30"
            required
            autocomplete="off"
          />
        </div>

        <div class="campo">
          <p>Edad de la mascota (meses):</p>
          <input
            type="number"
            id="edad_mascota"
            name="edadMascota"
            placeholder="Ej: 18"
            min="0"
            max="240"
            required
          />
        </div>

        <div class="campo">
          <p>Peso aproximado (kg):</p>
          <input
            type="number"
            id="peso_mascota"
            name="pesoMascota"
            placeholder="Ej: 12.5"
            min="0"
            max="200"
            step="0.1"
            required
          />
        </div>

        <div class="campo">
          <p>Fecha de nacimiento:</p>
          <input
            type="date"
            id="fecha_nacimiento"
            name="fechaNacimiento"
            required
          />
        </div>

        <div class="campo">
          <p>Teléfono de contacto:</p>
          <input
            type="tel"
            id="telefono_contacto"
            name="telefonoContacto"
            placeholder="Ej: 3001234567"
            size="20"
            maxlength="15"
            required
            autocomplete="tel"
          />
        </div>

        <div class="campo">
          <p>Correo electrónico:</p>
          <input
            type="email"
            id="correo_contacto"
            name="correoContacto"
            placeholder="Ej: ejemplo@correo.com"
            size="40"
            maxlength="50"
            required
            autocomplete="email"
          />
        </div>

        <div class="campo">
          <p>Dirección del propietario:</p>
          <input
            type="text"
            id="direccion"
            name="direccionPropietario"
            placeholder="Ej: Calle 12 # 34-56"
            size="50"
            maxlength="80"
            required
            autocomplete="street-address"
          />
        </div>

        <div class="botones">
          <input class="submit" type="submit" value="Enviar formulario" />
          <input class="reset" type="reset" value="Limpiar formulario" />
        </div>
      </form>
    </div>
  </body>
</html>
